<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Blackwater Quay Trilogy (Master Edition)</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Styling -->
    <style>
        :root {
            --bg-main: #090c0f;
            --bg-card: #12161d;
            --bg-card-hover: #181d26;
            --border-color: #222a36;
            --accent-gold: #d97706;
            --accent-gold-hover: #f59e0b;
            --accent-purple: #8b5cf6;
            --accent-teal: #06b6d4;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --transition-speed: 0.3s;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-main);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-gold);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Layout Grid */
        #sidebar {
            width: 280px;
            background-color: #0b0e12;
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
            z-index: 100;
        }

        #main-content {
            margin-left: 280px;
            flex: 1;
            padding: 3rem 4rem;
            max-width: 1400px;
        }

        /* Sidebar Elements */
        .sidebar-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 3rem;
            text-align: center;
        }

        .sidebar-brand h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-primary) 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-brand span {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .sidebar-nav {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            padding: 0.85rem 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all var(--transition-speed) ease;
            border-left: 3px solid transparent;
        }

        .sidebar-nav a:hover, .sidebar-nav a.active {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border-left-color: var(--accent-gold);
            transform: translateX(5px);
        }

        .sidebar-footer {
            margin-top: auto;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        /* Headers and Sections */
        header {
            margin-bottom: 4rem;
            position: relative;
        }

        header .subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        header h2 {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff 40%, #8899aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.7;
            max-width: 800px;
        }

        section {
            margin-bottom: 6rem;
            scroll-margin-top: 3rem;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-color) 0%, transparent 100%);
        }

        .section-title span {
            color: var(--accent-gold);
            font-size: 1.1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Maps and compound grid layout */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
        }

        .gallery-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all var(--transition-speed) ease;
            cursor: pointer;
            position: relative;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .gallery-card-img-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #000;
            position: relative;
        }

        .gallery-card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-speed) ease;
        }

        .gallery-card:hover .gallery-card-img-container img {
            transform: scale(1.05);
        }

        .gallery-card-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .gallery-card-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .gallery-card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .gallery-card-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            flex: 1;
        }

        .gallery-card-zoom {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: rgba(9, 12, 15, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--transition-speed) ease;
            z-index: 5;
        }

        .gallery-card:hover .gallery-card-zoom {
            opacity: 1;
        }

        /* Bestiary & Vessels Card List */
        .entity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2.5rem;
        }

        .entity-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all var(--transition-speed) ease;
        }

        .entity-card:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .entity-card-img {
            width: 100%;
            height: 280px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .entity-card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-speed) ease;
        }

        .entity-card-img:hover img {
            transform: scale(1.03);
        }

        .entity-card-body {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .entity-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .entity-card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .entity-card-specs {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
            background-color: rgba(9, 12, 15, 0.5);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .entity-card-name {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .entity-card-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Main Character Viewer Layout */
        .character-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            margin-bottom: 3.5rem;
            min-height: 520px;
            transition: border-color var(--transition-speed) ease;
        }

        .character-card:hover {
            border-color: var(--accent-gold);
        }

        .character-art-section {
            width: 45%;
            background-color: #000;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .character-display-img {
            width: 100%;
            flex: 1;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .character-display-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .character-display-img img.fade {
            opacity: 0.1;
            transform: scale(0.98);
        }

        .character-pose-selectors {
            display: flex;
            background-color: rgba(9, 12, 15, 0.95);
            border-top: 1px solid var(--border-color);
            padding: 0.75rem;
            gap: 0.5rem;
            justify-content: center;
        }

        .pose-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            font-weight: 500;
        }

        .pose-btn:hover {
            border-color: var(--accent-gold);
            color: var(--text-primary);
        }

        .pose-btn.active {
            background-color: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #000;
            font-weight: 600;
        }

        .character-info-section {
            width: 55%;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 1px solid var(--border-color);
        }

        .character-role-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-gold);
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .character-fullname {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .character-identity-row {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .character-identity-chip {
            background-color: rgba(9, 12, 15, 0.4);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: 'Outfit', sans-serif;
            color: var(--text-secondary);
        }

        .character-identity-chip strong {
            color: var(--text-primary);
        }

        .character-bio {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .character-pose-description {
            font-size: 0.9rem;
            color: var(--accent-gold);
            background-color: rgba(217, 119, 6, 0.05);
            border-left: 3px solid var(--accent-gold);
            padding: 0.75rem 1rem;
            line-height: 1.5;
            border-radius: 0 6px 6px 0;
        }

        /* Gear & Artifact Cards */
        .gear-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 2.5rem;
        }

        .gear-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all var(--transition-speed) ease;
        }

        .gear-card:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .gear-card-img {
            width: 100%;
            height: 250px;
            overflow: hidden;
            position: relative;
            background-color: #000;
            cursor: pointer;
        }

        .gear-card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-speed) ease;
        }

        .gear-card-img:hover img {
            transform: scale(1.04);
        }

        .gear-card-body {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .gear-owner {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .gear-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .gear-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Modal Lightbox styling */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(9, 12, 15, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 2rem;
        }

        #lightbox-container {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        #lightbox-caption {
            color: var(--text-primary);
            font-size: 1rem;
            margin-top: 1.5rem;
            text-align: center;
            font-family: 'Outfit', sans-serif;
            line-height: 1.5;
            max-width: 700px;
        }

        #lightbox-close {
            position: absolute;
            top: -2.5rem;
            right: 0;
            color: var(--text-secondary);
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            transition: color var(--transition-speed) ease;
        }

        #lightbox-close:hover {
            color: var(--accent-gold);
        }

        /* Responsive Layout fixes */
        @media (max-width: 1100px) {
            body {
                flex-direction: column;
            }

            #sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 1.5rem;
            }

            .sidebar-brand {
                margin-bottom: 1.5rem;
            }

            .sidebar-nav {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.5rem;
            }

            .sidebar-nav a {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }

            #main-content {
                margin-left: 0;
                padding: 2rem;
            }

            .character-card {
                flex-direction: column;
            }

            .character-art-section {
                width: 100%;
                height: 400px;
            }

            .character-info-section {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border-color);
                padding: 2rem;
            }
        }

        /* View Toggle in Sidebar */
        .view-toggle {
            display: flex;
            background-color: rgba(9, 12, 15, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.25rem;
            margin-bottom: 2rem;
            gap: 0.25rem;
        }
        .toggle-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 0.6rem 0.25rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all var(--transition-speed) ease;
            text-align: center;
        }
        .toggle-btn.active {
            background-color: var(--accent-gold);
            color: #090c0f !important;
        }
        .toggle-btn:hover:not(.active) {
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Scrollable Novel Nav in Sidebar */
        #novel-nav-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        .novel-nav-scroll {
            overflow-y: auto;
            max-height: calc(100vh - 280px);
            padding-right: 0.25rem;
        }
        .novel-nav-part-title {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 1rem 0 0.5rem 0.5rem;
            font-weight: 700;
            opacity: 0.8;
            border-bottom: 1px solid rgba(217, 119, 6, 0.15);
            padding-bottom: 0.25rem;
        }

        /* Reading View Pane */
        #novel-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .reader-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem 4rem;
            margin-top: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: background-color var(--transition-speed) ease, border-color var(--transition-speed) ease;
        }

        /* Reader Toolbar Settings */
        .reader-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .toolbar-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .toolbar-btn {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            transition: all var(--transition-speed) ease;
        }
        .toolbar-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .toolbar-select {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            outline: none;
        }
        .toolbar-select:focus {
            border-color: var(--accent-gold);
        }

        /* Theme selector specific */
        .theme-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform var(--transition-speed) ease;
        }
        .theme-dot.active {
            border-color: var(--accent-gold);
            transform: scale(1.2);
        }
        .theme-dot-dark { background-color: #090c0f; border: 1px solid #222a36; }
        .theme-dot-light { background-color: #ffffff; border: 1px solid #cbd5e1; }
        .theme-dot-sepia { background-color: #f4ecd8; border: 1px solid #d7c59d; }

        /* Chapter Reading Text Styles */
        .chapter-header {
            text-align: center;
            margin-bottom: 3.5rem;
        }
        .chapter-part-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .chapter-part-title-label {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }
        .chapter-main-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-primary);
        }
        .reading-pane {
            font-size: 1.2rem;
            line-height: 1.85;
            color: var(--text-primary);
            transition: font-size 0.2s ease, font-family 0.2s ease;
        }
        .reading-pane p {
            margin-bottom: 1.75rem;
            text-align: justify;
        }
        .reading-pane p.first-paragraph::first-letter {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            float: left;
            margin-right: 0.6rem;
            margin-top: 0.1rem;
            line-height: 0.85;
            color: var(--accent-gold);
            font-weight: 900;
        }

        /* Psionic dialogue formatting */
        .psionic-dialogue {
            font-style: italic;
            color: var(--accent-purple);
            text-shadow: 0 0 2px rgba(139, 92, 246, 0.15);
        }

        /* Scene Divider */
        .scene-divider {
            text-align: center;
            color: var(--accent-gold);
            font-size: 1.4rem;
            letter-spacing: 8px;
            margin: 3.5rem 0;
            font-weight: 700;
            opacity: 0.8;
        }

        /* Reader Footer Navigation */
        .reader-footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
            margin-top: 4rem;
            gap: 1rem;
        }
        .nav-arrow-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all var(--transition-speed) ease;
            text-decoration: none;
        }
        .nav-arrow-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            transform: translateY(-2px);
        }
        .nav-arrow-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
            cursor: not-allowed;
        }

        /* Table of Contents Grid View */
        .toc-container {
            width: 100%;
            max-width: 1000px;
            margin-top: 1.5rem;
        }
        .toc-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
        }
        .toc-part-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
        }
        .toc-part-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        .toc-part-name {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .toc-part-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .toc-chapters-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }
        .toc-chapter-link {
            display: flex;
            flex-direction: column;
            padding: 0.75rem 1rem;
            background-color: rgba(9, 12, 15, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            text-decoration: none;
        }
        .toc-chapter-link:hover {
            border-color: var(--accent-gold);
            background-color: rgba(217, 119, 6, 0.04);
            transform: translateY(-2px);
        }
        .toc-chapter-num {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--accent-gold);
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .toc-chapter-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Three theme settings styling on body */
        body.theme-dark {
    --novel-bg: #0f172a;
    --novel-text: #e2e8f0;
    transition: background-color 0.5s ease, color 0.5s ease;
}

body.theme-sepia {
    --novel-bg: #f4ecd8;
    --novel-text: #433422;
    transition: background-color 0.5s ease, color 0.5s ease;
}

body.theme-light {
    --novel-bg: #ffffff;
    --novel-text: #111827;
    transition: background-color 0.5s ease, color 0.5s ease;
}

.novel-content-wrapper {
    background-color: var(--novel-bg) !important;
    color: var(--novel-text) !important;
    font-size: var(--novel-font-size) !important;
    transition: all 0.3s ease;
}

.novel-content-wrapper h1, .novel-content-wrapper h2, .novel-content-wrapper h3 {
    color: var(--novel-text) !important;
}

body.focus-mode .site-header {
    transform: translateY(-100%);
    transition: transform 0.3s ease;
}

body:not(.focus-mode) .site-header {
    transform: translateY(0);
    transition: transform 0.3s ease;
}

#reading-progress-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: transparent;
    z-index: 10005;
}
#reading-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d4af37, #fef08a);
    box-shadow: 0 0 10px #d4af37;
    transition: width 0.1s ease;
}

#reading-toolbar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 30px;
    padding: 10px 20px;
    display: flex;
    gap: 15px;
    z-index: 10001;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
}
}

.toolbar-btn {
    background: transparent;
    border: 1px solid #475569;
    color: #e2e8f0;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
}

.toolbar-btn:hover {
    background: #1e293b;
    color: #38bdf8;
    border-color: #38bdf8;
}

.toolbar-btn.active {
    background: #38bdf8;
    color: #0f172a;
}
</style>


<div id="reading-progress-container">
    <div id="reading-progress-bar"></div>
</div>
<div id="reading-toolbar">
    <button class="toolbar-btn" id="btn-theme-dark" title="Dark Mode" style="background: #0f172a; color: #fff;">D</button>
    <button class="toolbar-btn" id="btn-theme-sepia" title="Sepia Mode" style="background: #f4ecd8; color: #433422;">S</button>
    <button class="toolbar-btn" id="btn-theme-light" title="Light Mode" style="background: #ffffff; color: #000;">L</button>
    <div style="width: 2px; background: #475569; margin: 0 5px;"></div>
    <button class="toolbar-btn" id="btn-font-dec" title="Decrease Font">A-</button>
    <button class="toolbar-btn" id="btn-font-inc" title="Increase Font">A+</button>
    <div style="width: 2px; background: #475569; margin: 0 5px;"></div>
    <button class="toolbar-btn" id="btn-focus-toggle" title="Toggle Focus Mode" style="width:auto; border-radius:15px; padding: 0 15px;">Focus</button>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const container = document.querySelector('.container');
        if(container) {
            container.classList.add('novel-content-wrapper');
        }

        const body = document.body;
        
        document.getElementById('btn-theme-dark').addEventListener('click', () => {
            body.classList.remove('theme-sepia', 'theme-light');
            body.classList.add('theme-dark');
        });
        document.getElementById('btn-theme-sepia').addEventListener('click', () => {
            body.classList.remove('theme-dark', 'theme-light');
            body.classList.add('theme-sepia');
        });
        document.getElementById('btn-theme-light').addEventListener('click', () => {
            body.classList.remove('theme-dark', 'theme-sepia');
            body.classList.add('theme-light');
        });

        let currentFontSize = 18;
        document.getElementById('btn-font-inc').addEventListener('click', () => {
            currentFontSize += 2;
            document.documentElement.style.setProperty('--novel-font-size', currentFontSize + 'px');
        });
        document.getElementById('btn-font-dec').addEventListener('click', () => {
            currentFontSize -= 2;
            document.documentElement.style.setProperty('--novel-font-size', currentFontSize + 'px');
        });

        
        // Scroll progress
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('reading-progress-bar').style.width = scrolled + "%";
        });

        document.getElementById('btn-focus-toggle').addEventListener('click', function() {
            body.classList.toggle('focus-mode');
            this.classList.toggle('active');
        });
    });
</script>

</body>
</html>
